name: Build BeeChat Store APK

on:
workflow_dispatch:
push:
paths:
- 'BeeChatStore_APK_Upload_To_GitHub.zip'
- '.github/workflows/main.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository files
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Extract project ZIP
    run: |
      unzip -q BeeChatStore_APK_Upload_To_GitHub.zip -d buildsrc

  - name: Build APK
    run: |
      gradle -p buildsrc assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: BeeChatStore-APK
      path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
